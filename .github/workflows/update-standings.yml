name: Update standings

on:
  schedule:
    # 10:00 UTC = 6 AM ET during daylight time (5 AM ET in winter), well after West Coast games end.
    - cron: "0 10 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Commit updated standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          git diff --staged --quiet || (git commit -m "Update standings $(date -u +%F)" && git push)

name: Update standings

on:
  schedule:
    # 09:37 UTC = 5:37 AM ET during daylight time (4:37 AM ET in winter), well after West Coast games end.
    # Off-minute times dodge GitHub's top-of-hour scheduling backlog. The 11:43 run is a backup in case
    # the first is delayed or dropped; if nothing changed it commits only a new timestamp.
    # Scheduled runs act as whoever last changed these cron lines, so commit them as the repo owner.
    - cron: "37 9 * * *" # main run
    - cron: "43 11 * * *" # backup run
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update.mjs
      - name: Commit updated standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "Update standings $(date -u +%F)" && git push)

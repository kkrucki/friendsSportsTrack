<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NBA Picks Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
  <style>
    :root {
      --bg: #f5f5f4;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --accent: #ea580c;
      --win: #15803d;
      --loss: #b91c1c;
      --bar: #fed7aa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09;
        --card: #1c1917;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --border: #292524;
        --accent: #fb923c;
        --win: #4ade80;
        --loss: #f87171;
        --bar: #7c2d12;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    header h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 40px 0 12px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }

    .board { list-style: none; margin: 0; padding: 0; overflow: hidden; }
    .board li {
      display: grid;
      grid-template-columns: 32px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      position: relative;
    }
    .board li:first-child { border-top: 0; }
    .board .rank { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
    .board .name { font-weight: 600; }
    .board .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .board .bar { height: 6px; border-radius: 3px; background: var(--bar); margin-top: 6px; }
    .board .bar span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
    .board .pts { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    .board .pts small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .board li.leader .rank { color: var(--accent); }

    .owners { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .owner { padding: 16px; }
    .owner h3 { margin: 0 0 8px; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; }
    .owner h3 span { font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
    .teams { list-style: none; margin: 0; padding: 0; }
    .teams li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); font-size: 15px; }
    .teams li:first-child { border-top: 0; }
    .teams img { width: 24px; height: 24px; object-fit: contain; flex: none; }
    .teams .team { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .teams .rec { font-variant-numeric: tabular-nums; font-weight: 600; }
    .rec .w { color: var(--win); }
    .rec .l { color: var(--loss); }

    .error { padding: 16px; color: var(--loss); }
    @media (max-width: 400px) { .owners { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>🏀 NBA Picks Tracker</h1>
      <p id="updated">Loading…</p>
    </header>

    <h2>Leaderboard</h2>
    <ol class="board card" id="board"></ol>

    <h2>Scorecards</h2>
    <div class="owners" id="owners"></div>
  </main>

  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const record = (w, l) => `<span class="w">${w}</span>–<span class="l">${l}</span>`;
    const pct = (w, l) => (w + l ? (w / (w + l)).toFixed(3).replace(/^0/, "") : ".000");

    async function load() {
      const [picks, standings] = await Promise.all([
        fetch("picks.json", { cache: "no-store" }).then((r) => r.json()),
        fetch("data/standings.json", { cache: "no-store" }).then((r) => r.json()),
      ]);

      // One point per win; ties broken by fewer losses.
      const owners = Object.entries(picks).map(([name, teamNames]) => {
        const teams = teamNames
          .map((t) => ({ name: t, ...(standings.teams[t] ?? { wins: 0, losses: 0 }) }))
          .sort((a, b) => b.wins - a.wins || a.losses - b.losses || a.name.localeCompare(b.name));
        const wins = teams.reduce((n, t) => n + t.wins, 0);
        const losses = teams.reduce((n, t) => n + t.losses, 0);
        return { name, teams, wins, losses };
      }).sort((a, b) => b.wins - a.wins || a.losses - b.losses);

      const maxWins = Math.max(1, ...owners.map((o) => o.wins));
      let rank = 0;
      document.getElementById("board").innerHTML = owners.map((o, i) => {
        const prev = owners[i - 1];
        if (!prev || prev.wins !== o.wins || prev.losses !== o.losses) rank = i + 1;
        return `
          <li class="${rank === 1 ? "leader" : ""}">
            <div class="rank">${rank}</div>
            <div>
              <div class="name">${esc(o.name)}${rank === 1 ? " 🔥" : ""}</div>
              <div class="meta">${o.wins}–${o.losses} · ${pct(o.wins, o.losses)}</div>
              <div class="bar"><span style="width:${(o.wins / maxWins) * 100}%"></span></div>
            </div>
            <div class="pts">${o.wins}<small>${o.wins === 1 ? "pt" : "pts"}</small></div>
          </li>`;
      }).join("");

      document.getElementById("owners").innerHTML = owners.map((o) => `
        <section class="owner card">
          <h3>${esc(o.name)} <span>${o.wins} pts · ${o.wins}–${o.losses}</span></h3>
          <ul class="teams">
            ${o.teams.map((t) => `
              <li>
                ${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ""}
                <span class="team">${esc(t.name)}</span>
                <span class="rec">${record(t.wins, t.losses)}</span>
              </li>`).join("")}
          </ul>
        </section>`).join("");

      const when = new Date(standings.updatedAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      document.getElementById("updated").textContent = `${standings.season ?? ""} season · Updated ${when}`;
    }

    load().catch((err) => {
      document.getElementById("updated").textContent = "";
      document.getElementById("board").innerHTML = `<li class="error">Couldn't load standings: ${esc(err.message)}</li>`;
    });
  </script>
</body>
</html>
